<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rean's 20th bday</title>
    <meta property="og:title" content="ur invited to rean's 20th!">
    <meta property="og:description" content="august 24th ~ karaoke, music, jackbox, drinks">
    <meta property="og:image" content="assets/imgs/doggy.jpg">
    <meta property="og:url" content="https://sojumilk.ie/">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #000;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            margin: 20px 0 10px 0;
        }
        p {
            text-align: center;
            margin: 10px 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        img {
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            display: block;
        }
        form {
            margin: 20px 0;
        }
        label {
            display: block;
            margin: 15px 0 5px 0;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #000;
            font-size: 1rem;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .avatar-controls {
            text-align: center;
            margin: 20px 0;
        }
        .avatar-preview {
            font-size: 4rem;
            margin: 20px 0;
            text-align: center;
        }
        .avatar-info {
            text-align: center;
            font-size: 0.9rem;
            margin: 10px 0;
        }
        .arrow-hints {
            text-align: center;
            font-size: 0.8rem;
            color: #666;
            margin: 10px 0;
        }
        .avatar-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
            align-items: center;
        }
        .avatar-button {
            padding: 8px 12px;
            font-size: 1.2rem;
            cursor: pointer;
            min-width: 40px;
        }
        .avatar-section {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #000;
            background: #fafafa;
        }
        .color-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }
        .color-button {
            width: 40px;
            height: 40px;
            border: 2px solid #000;
            cursor: pointer;
            border-radius: 50%;
        }
        .color-button.selected {
            border-width: 4px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .color-label {
            font-size: 0.8rem;
            display: block;
            margin-top: 4px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 1rem;
        }
        .button-group {
            text-align: center;
            margin: 20px 0;
        }
        .responses {
            margin-top: 30px;
            border-top: 1px solid #000;
            padding-top: 20px;
        }
        .response-item {
            border: 1px solid #000;
            padding: 10px;
            margin: 10px 0;
            background: #fafafa;
        }
        .response-avatar {
            font-size: 2rem;
            display: inline-block;
            margin-right: 10px;
        }
        .response-name {
            font-weight: bold;
            display: inline-block;
        }
        .images-section {
            margin-top: 30px;
            border-top: 1px solid #000;
            padding-top: 20px;
        }
        .photo-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .photo-grid img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #000;
            cursor: pointer;
        }
        .photo-grid img:hover {
            opacity: 0.8;
        }
        .note {
            font-size: 0.9rem;
            font-style: italic;
            margin: 15px 0;
        }
        .checkbox-group {
            margin: 10px 0;
        }
        .checkbox-group label {
            display: block;
            margin: 8px 0;
        }
        .button-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .button-options button {
            width: 100%;
            margin: 0;
        }
        a {
            color: #0000ff;
            text-decoration: underline;
        }
        .jumpscare-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .jumpscare-overlay.active {
            display: flex;
        }
        .jumpscare-container {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }
        .jumpscare-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .jumpscare-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 2px solid #000;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 1.25rem;
            }
            h2 {
                font-size: 1.1rem;
            }
            .avatar-preview {
                font-size: 3rem;
            }
            input[type="text"], input[type="url"] {
                font-size: 16px;
            }
            button {
                padding: 10px 15px;
                font-size: 0.95rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>reans 20th very epic</h1>
    <p>august 24th 2024 ~ did smthn</p>
    <p class="note">thanks 4 comin!</p>

    <img src="assets/imgs/doggy.jpg" alt="memories" style="width: 100%; max-width: 300px; height: auto; margin: 20px 0;">

    <!-- FINAL GUEST LIST -->
    <div class="responses" id="responses-container" style="display: none;">
        <h2>who made it:</h2>
        <div id="responses-list"></div>
    </div>

    <!-- PHOTOS GALLERY - MAIN FOCUS -->
    <div class="images-section">
        <h2>pics from the night 📸</h2>

        <!-- FILE UPLOAD -->
        <div style="margin: 15px 0; padding: 10px; background: #fafafa; border: 1px solid #000;">
            <label for="photo-upload" style="display: block; margin-bottom: 8px;">add your pics:</label>
            <input type="file" id="photo-upload" accept="image/*" multiple style="padding: 5px 0;">
            <button onclick="uploadPhotos()" style="margin-top: 8px;">upload</button>
        </div>

        <p style="font-size: 0.9rem; color: #666;">tap to view full size</p>
        <div class="photo-grid" id="photo-grid" style="margin-top: 15px;"></div>
        <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: #999;">
            <a href="https://drive.google.com/drive/folders/1NOzEsGmkzHOnN6oqP3titsBYsFH4XtxX?usp=sharing" target="_blank">>>> full album on google drive</a>
        </p>
    </div>

</div>

<!-- JUMPSCARE OVERLAY -->
<div class="jumpscare-overlay" id="jumpscare-overlay">
    <div class="jumpscare-container">
        <button class="jumpscare-close" onclick="closeJumpscare()">×</button>
        <img src="assets/imgs/jumpscare.jpg" alt="jumpscare" class="jumpscare-image">
    </div>
</div>

<script>
const eyes = [':', ';', 'O', 'x'];
const mouths = [')', 'P', '/', '(', 'D','3'];
const colors = [
    { name: 'black', hex: '#000000' },
    { name: 'white', hex: '#F0F0F0' },
    { name: 'red', hex: '#ff0000' },
    { name: 'blue', hex: '#0000ff' },
    { name: 'green', hex: '#00ff00' },
    { name: 'yellow', hex: '#FADB41' },
    { name: 'pink', hex: '#ff00ff' },
    { name: 'brown', hex: '#754D31' },
    { name: 'the purps', hex: '#8834D1'}
];

let currentEyesIndex = 0;
let currentMouthIndex = 0;
let currentColorIndex = 0;
let rsvpData = {
    coming: null,
    activities: [],
    ears: null
};

function playSound(type) {
    let filename = 'click.mp3';
    if (type === 'yay') {
        filename = 'yay.mp3';
    } else if (type === 'jumpscare') {
        filename = 'jumpscare.mp3';
    }
    const audio = new Audio(`assets/sfx/${filename}`);
    audio.play().catch(() => {});
}

function goToPage(pageNum) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + pageNum).classList.add('active');
}

function showJumpscare() {
    document.getElementById('jumpscare-overlay').classList.add('active');
}

function closeJumpscare() {
    document.getElementById('jumpscare-overlay').classList.remove('active');
}

function updateAvatarPreview() {
    const avatar = eyes[currentEyesIndex] + mouths[currentMouthIndex];
    const color = colors[currentColorIndex].hex;
    const previewEl = document.getElementById('avatar-preview');
    if (!previewEl) return; // Element doesn't exist on this page

    previewEl.textContent = avatar;
    previewEl.style.color = color;
    const eyesEl = document.getElementById('eyes-display');
    const mouthEl = document.getElementById('mouth-display');
    if (eyesEl) eyesEl.textContent = eyes[currentEyesIndex];
    if (mouthEl) mouthEl.textContent = mouths[currentMouthIndex];
}

function changeLEyes() {
    currentEyesIndex = (currentEyesIndex - 1 + eyes.length) % eyes.length;
    updateAvatarPreview();
}

function changeMouth() {
    currentMouthIndex = (currentMouthIndex + 1) % mouths.length;
    updateAvatarPreview();
}

function saveResponse(key, value) {
    rsvpData[key] = value;
}

function saveActivities() {
    const checkboxes = document.querySelectorAll('input[name="activity"]:checked');
    rsvpData.activities = Array.from(checkboxes).map(cb => cb.value);
}

function saveEars(value) {
    rsvpData.ears = value;
}

function submitRsvp() {
    const name = document.getElementById('name').value;
    const contact = document.getElementById('contact').value;
    const contactPublic = document.getElementById('contact-public').checked;

    if (!name) {
        alert('please enter your name');
        return;
    }

    const avatar = eyes[currentEyesIndex] + mouths[currentMouthIndex];
    const color = colors[currentColorIndex].name;

    let responses = JSON.parse(localStorage.getItem('rsvp-responses') || '[]');
    const response = { name, contact, contactPublic, avatar, color, ...rsvpData };
    responses.push(response);
    localStorage.setItem('rsvp-responses', JSON.stringify(responses));

    // Send to Google Sheets
    sendToGoogleSheets(response);

    document.getElementById('name').value = '';
    document.getElementById('contact').value = '';
    document.getElementById('contact-public').checked = false;
    currentEyesIndex = 0;
    currentMouthIndex = 0;
    currentColorIndex = 0;
    updateAvatarPreview();
    goToPage(1);
    rsvpData = { coming: null, activities: [], ears: null };

    displayResponses();
}

function sendToGoogleSheets(response) {
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbxFnAHaBt0mCIz1W6RleNC83sz3Dj987D0R-1JndtVefjMx8LFBeqO2VOECngBD7ges/exec';

    const data = {
        name: response.name,
        contact: response.contact,
        contactPublic: response.contactPublic ? 'Public' : 'Hidden',
        avatar: response.avatar,
        color: response.color,
        coming: response.coming ? 'Yes' : 'No',
        activities: response.activities.join(', '),
        earProtection: response.ears,
        timestamp: new Date().toLocaleString()
    };

    fetch(sheetUrl, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
    }).catch(() => {});
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
        currentEyesIndex = (currentEyesIndex - 1 + eyes.length) % eyes.length;
        updateAvatarPreview();
    } else if (e.key === 'ArrowRight') {
        currentMouthIndex = (currentMouthIndex + 1) % mouths.length;
        updateAvatarPreview();
    }
});

async function displayResponses() {
    try {
        // Use Google Sheets gviz endpoint (no CORS issues!)
        const SHEET_ID = '1xGxaS8O0_9IwepWrc03M3GBamYQB3Qng1U5YSR9qczs';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=RSVP%20Responses`;

        const res = await fetch(url);
        const text = await res.text();

        // Parse Google's JSON response (it's wrapped in a callback)
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/);
        if (!match) {
            console.error('Failed to parse Google Sheets response');
            return;
        }

        const json = JSON.parse(match[1]);

        if (!json.table || !json.table.rows) {
            console.log('No data in sheet');
            document.getElementById('responses-container').style.display = 'none';
            return;
        }

        const rows = json.table.rows;
        const container = document.getElementById('responses-container');
        const list = document.getElementById('responses-list');

        container.style.display = 'block';
        list.innerHTML = '';

        let count = 0;
        // Parse rows (skip first row which is headers)
        rows.forEach((row, idx) => {
            if (idx === 0) return; // Skip headers

            const cells = row.c;
            if (!cells) return;

            // Log to see structure
            console.log(`Row ${idx}:`, cells.map(c => c?.v));

            // Check if coming = 'Yes' (should be index 6)
            if (cells[6]?.v !== 'Yes') return;

            const name = cells[1]?.v || '';
            const contact = cells[2]?.v || '';
            const contactPublic = cells[3]?.v || '';
            const avatar = cells[4]?.v || '';
            const color = cells[5]?.v || '';

            if (!name || !avatar) return; // Skip incomplete entries

            const item = document.createElement('div');
            item.className = 'response-item';

            const avatarColor = color ?
                colors.find(c => c.name === color)?.hex || '#000000' : '#000000';

            const contactDisplay = contactPublic === 'Public' && contact
                ? contact
                : 'shhh';

            item.innerHTML = `
                <span class="response-avatar" style="color: ${avatarColor}">${avatar}</span>
                <span class="response-name" style="color: ${avatarColor}">${name}</span>
                <span style="color: #999; font-size: 0.85rem;">(${contactDisplay})</span>
            `;
            list.appendChild(item);
            count++;
        });

        console.log(`Displayed ${count} responses`);
        if (count === 0) {
            container.style.display = 'none';
        }
    } catch (err) {
        console.error('Error loading responses:', err);
    }
}

document.getElementById('google-photos-link').href = 'https://drive.google.com/drive/folders/1NOzEsGmkzHOnN6oqP3titsBYsFH4XtxX?usp=sharing';

function initializeColorSelector() {
    const colorSelector = document.getElementById('color-selector');
    if (!colorSelector) return; // Element doesn't exist on this page

    colors.forEach((color, index) => {
        const colorBtn = document.createElement('div');
        colorBtn.style.textAlign = 'center';
        colorBtn.innerHTML = `
            <button class="color-button ${index === 0 ? 'selected' : ''}"
                    style="background-color: ${color.hex}"
                    onclick="selectColor(${index})"
                    title="${color.name}"></button>
            <span class="color-label">${color.name}</span>
        `;
        colorSelector.appendChild(colorBtn);
    });
}

function selectColor(index) {
    currentColorIndex = index;
    document.querySelectorAll('.color-button').forEach(btn => btn.classList.remove('selected'));
    document.querySelectorAll('.color-button')[index].classList.add('selected');
    updateAvatarPreview();
}

function displayPhotos() {
    const photoGrid = document.getElementById('photo-grid');
    photoGrid.innerHTML = '';

    // Show uploaded images first (from Google Drive)
    uploadedImages.forEach((url, idx) => {
        if (!url) return;
        const container = document.createElement('div');
        container.style.cursor = 'pointer';
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'uploaded photo';
        img.onclick = () => window.open(url, '_blank');
        container.appendChild(img);
        photoGrid.appendChild(container);
    });

    // Load images from assets/photos/ folder
    const possibleNames = [
        'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg', 'photo5.jpg',
        'photo6.jpg', 'photo7.jpg', 'photo8.jpg', 'photo9.jpg', 'photo10.jpg',
        '1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg',
        'pic1.jpg', 'pic2.jpg', 'pic3.jpg', 'pic4.jpg', 'pic5.jpg'
    ];

    let loadedCount = uploadedImages.filter(u => u).length;

    possibleNames.forEach(filename => {
        const img = new Image();
        img.onload = () => {
            const container = document.createElement('div');
            container.style.cursor = 'pointer';
            const imgEl = document.createElement('img');
            imgEl.src = `assets/photos/${filename}`;
            imgEl.alt = 'photo';
            imgEl.onclick = () => window.open(`assets/photos/${filename}`, '_blank');
            container.appendChild(imgEl);
            photoGrid.appendChild(container);
            loadedCount++;
        };
        img.onerror = () => {};
        img.src = `assets/photos/${filename}`;
    });

    // If no images found after a brief wait, show message
    setTimeout(() => {
        if (loadedCount === 0) {
            photoGrid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 30px; background: #fafafa; border: 1px solid #000;">
                    <p style="margin: 10px 0;">📁 no photos yet</p>
                    <p style="font-size: 0.85rem; color: #666; margin: 10px 0;">upload some above or add to assets/photos/ folder</p>
                </div>
            `;
        }
    }, 500);
}

let uploadedImages = [];

displayResponses();
loadUploadedImages();  // Load previously uploaded photos
displayPhotos();
updateAvatarPreview();
initializeColorSelector();

function uploadPhotos() {
    const fileInput = document.getElementById('photo-upload');
    const files = Array.from(fileInput.files);

    if (files.length === 0) {
        alert('select photos to upload');
        return;
    }

    // Send each image to Google Drive
    files.forEach(file => {
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                sendImageToGoogleDrive(file.name, base64);
            };
            reader.readAsDataURL(file);
        }
    });

    // Clear input
    fileInput.value = '';
    playSound('yay');
}

async function sendImageToGoogleDrive(filename, base64Data) {
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbxFnAHaBt0mCIz1W6RleNC83sz3Dj987D0R-1JndtVefjMx8LFBeqO2VOECngBD7ges/exec';

    try {
        const response = await fetch(sheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: 'uploadPhoto',
                filename: filename,
                imageData: base64Data
            })
        });

        // Since no-cors doesn't return response, just assume success
        loadUploadedImages();
    } catch (err) {
        console.error('Upload error:', err);
    }
}

async function loadUploadedImages() {
    try {
        const SHEET_ID = '1xGxaS8O0_9IwepWrc03M3GBamYQB3Qng1U5YSR9qczs';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=uploaded_photos`;

        const res = await fetch(url);
        const text = await res.text();
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/);

        if (!match) return;

        const json = JSON.parse(match[1]);
        if (!json.table || !json.table.rows) return;

        uploadedImages = [];
        const rows = json.table.rows;

        rows.forEach((row, idx) => {
            if (idx === 0) return; // Skip headers
            const cells = row.c;
            if (cells && cells[1]?.v) {
                uploadedImages.push(cells[1].v); // URL from Google Drive
            }
        });

        displayPhotos();
    } catch (err) {
        console.log('Could not load uploaded images');
    }
}
</script>

</body>
</html>
