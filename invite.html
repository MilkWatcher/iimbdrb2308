<script>
const eyes = [':', ';', 'O', 'x'];
const mouths = [')', 'P', '/', '(', 'D','3'];
const colors = [
    { name: 'black', hex: '#000000' },
    { name: 'white', hex: '#F0F0F0' },
    { name: 'red', hex: '#ff0000' },
    { name: 'blue', hex: '#0000ff' },
    { name: 'green', hex: '#00ff00' },
    { name: 'yellow', hex: '#FADB41' },
    { name: 'pink', hex: '#ff00ff' },
    { name: 'brown', hex: '#754D31' },
    { name: 'the purps', hex: '#8834D1'}
];

let currentEyesIndex = 0;
let currentMouthIndex = 0;
let currentColorIndex = 0;
let rsvpData = {
    coming: null,
    activities: [],
    ears: null
};

function playSound(type) {
    let filename = 'click.mp3';
    if (type === 'yay') {
        filename = 'yay.mp3';
    } else if (type === 'jumpscare') {
        filename = 'jumpscare.mp3';
    }
    const audio = new Audio(`assets/sfx/${filename}`);
    audio.play().catch(() => {});
}

function goToPage(pageNum) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + pageNum).classList.add('active');
}

function showJumpscare() {
    document.getElementById('jumpscare-overlay').classList.add('active');
}

function closeJumpscare() {
    document.getElementById('jumpscare-overlay').classList.remove('active');
}

function updateAvatarPreview() {
    const avatar = eyes[currentEyesIndex] + mouths[currentMouthIndex];
    const color = colors[currentColorIndex].hex;
    const previewEl = document.getElementById('avatar-preview');
    if (!previewEl) return; // Element doesn't exist on this page

    previewEl.textContent = avatar;
    previewEl.style.color = color;
    const eyesEl = document.getElementById('eyes-display');
    const mouthEl = document.getElementById('mouth-display');
    if (eyesEl) eyesEl.textContent = eyes[currentEyesIndex];
    if (mouthEl) mouthEl.textContent = mouths[currentMouthIndex];
}

function changeLEyes() {
    currentEyesIndex = (currentEyesIndex - 1 + eyes.length) % eyes.length;
    updateAvatarPreview();
}

function changeMouth() {
    currentMouthIndex = (currentMouthIndex + 1) % mouths.length;
    updateAvatarPreview();
}

function saveResponse(key, value) {
    rsvpData[key] = value;
}

function saveActivities() {
    const checkboxes = document.querySelectorAll('input[name="activity"]:checked');
    rsvpData.activities = Array.from(checkboxes).map(cb => cb.value);
}

function saveEars(value) {
    rsvpData.ears = value;
}

function submitRsvp() {
    const name = document.getElementById('name').value;
    const contact = document.getElementById('contact').value;
    const contactPublic = document.getElementById('contact-public').checked;

    if (!name) {
        alert('please enter your name');
        return;
    }

    const avatar = eyes[currentEyesIndex] + mouths[currentMouthIndex];
    const color = colors[currentColorIndex].name;

    let responses = JSON.parse(localStorage.getItem('rsvp-responses') || '[]');
    const response = { name, contact, contactPublic, avatar, color, ...rsvpData };
    responses.push(response);
    localStorage.setItem('rsvp-responses', JSON.stringify(responses));

    // Send to Google Sheets
    sendToGoogleSheets(response);

    document.getElementById('name').value = '';
    document.getElementById('contact').value = '';
    document.getElementById('contact-public').checked = false;
    currentEyesIndex = 0;
    currentMouthIndex = 0;
    currentColorIndex = 0;
    updateAvatarPreview();
    goToPage(1);
    rsvpData = { coming: null, activities: [], ears: null };

    displayResponses();
}

function sendToGoogleSheets(response) {
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbxFnAHaBt0mCIz1W6RleNC83sz3Dj987D0R-1JndtVefjMx8LFBeqO2VOECngBD7ges/exec';

    const data = {
        name: response.name,
        contact: response.contact,
        contactPublic: response.contactPublic ? 'Public' : 'Hidden',
        avatar: response.avatar,
        color: response.color,
        coming: response.coming ? 'Yes' : 'No',
        activities: response.activities.join(', '),
        earProtection: response.ears,
        timestamp: new Date().toLocaleString()
    };

    fetch(sheetUrl, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
    }).catch(() => {});
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') {
        currentEyesIndex = (currentEyesIndex - 1 + eyes.length) % eyes.length;
        updateAvatarPreview();
    } else if (e.key === 'ArrowRight') {
        currentMouthIndex = (currentMouthIndex + 1) % mouths.length;
        updateAvatarPreview();
    }
});

let guestList = [];

async function displayResponses() {
    try {
        // Use Google Sheets gviz endpoint (no CORS issues!)
        const SHEET_ID = '1xGxaS8O0_9IwepWrc03M3GBamYQB3Qng1U5YSR9qczs';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=RSVP%20Responses`;

        const res = await fetch(url);
        const text = await res.text();

        // Parse Google's JSON response (it's wrapped in a callback)
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/);
        if (!match) {
            console.error('Failed to parse Google Sheets response');
            return;
        }

        const json = JSON.parse(match[1]);

        if (!json.table || !json.table.rows) {
            console.log('No data in sheet');
            document.getElementById('responses-container').style.display = 'none';
            return;
        }

        const rows = json.table.rows;
        const container = document.getElementById('responses-container');
        const list = document.getElementById('responses-list');

        container.style.display = 'block';
        list.innerHTML = '';
        guestList = [];

        let count = 0;
        // Parse rows (skip first row which is headers)
        rows.forEach((row, idx) => {
            if (idx === 0) return; // Skip headers

            const cells = row.c;
            if (!cells) return;

            // Check if coming = 'Yes' (should be index 6)
            if (cells[6]?.v !== 'Yes') return;

            const name = cells[1]?.v || '';
            const contact = cells[2]?.v || '';
            const contactPublic = cells[3]?.v || '';
            const avatar = cells[4]?.v || '';
            const color = cells[5]?.v || '';

            if (!name || !avatar) return; // Skip incomplete entries

            guestList.push({ name, avatar, color });

            const item = document.createElement('div');
            item.className = 'response-item';

            const avatarColor = color ?
                colors.find(c => c.name === color)?.hex || '#000000' : '#000000';

            const contactDisplay = contactPublic === 'Public' && contact
                ? contact
                : 'shhh';

            item.innerHTML = `
                <span class="response-avatar" style="color: ${avatarColor}">${avatar}</span>
                <span class="response-name" style="color: ${avatarColor}">${name}</span>
                <span style="color: #999; font-size: 0.85rem;">(${contactDisplay})</span>
            `;
            list.appendChild(item);
            count++;
        });

        if (count === 0) {
            container.style.display = 'none';
        }

        // Guest list is needed by the tag picker & lightbox, so re-render
        // photos now that guest colors/avatars are available.
        displayPhotos();
    } catch (err) {
        console.error('Error loading responses:', err);
    }
}

function findGuest(name) {
    return guestList.find(g => g.name === name);
}

function initializeColorSelector() {
    const colorSelector = document.getElementById('color-selector');
    if (!colorSelector) return; // Element doesn't exist on this page

    colors.forEach((color, index) => {
        const colorBtn = document.createElement('div');
        colorBtn.style.textAlign = 'center';
        colorBtn.innerHTML = `
            <button class="color-button ${index === 0 ? 'selected' : ''}"
                    style="background-color: ${color.hex}"
                    onclick="selectColor(${index})"
                    title="${color.name}"></button>
            <span class="color-label">${color.name}</span>
        `;
        colorSelector.appendChild(colorBtn);
    });
}

function selectColor(index) {
    currentColorIndex = index;
    document.querySelectorAll('.color-button').forEach(btn => btn.classList.remove('selected'));
    document.querySelectorAll('.color-button')[index].classList.add('selected');
    updateAvatarPreview();
}

let photos = []; // {fileId, url, filename, tagged: string[]}
let currentLightboxIndex = null;

function displayPhotos() {
    const photoGrid = document.getElementById('photo-grid');
    photoGrid.innerHTML = '';

    if (photos.length === 0) {
        photoGrid.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 30px; background: #fafafa; border: 1px solid #000;">
                <p style="margin: 10px 0;">📁 no photos yet</p>
                <p style="font-size: 0.85rem; color: #666; margin: 10px 0;">upload some above!</p>
            </div>
        `;
        return;
    }

    photos.forEach((photo, idx) => {
        const container = document.createElement('div');
        container.style.cursor = 'pointer';
        const img = document.createElement('img');
        img.src = photo.url;
        img.alt = 'party photo';
        img.onclick = () => openLightbox(idx);
        container.appendChild(img);
        photoGrid.appendChild(container);
    });
}

async function loadUploadedImages() {
    try {
        const SHEET_ID = '1xGxaS8O0_9IwepWrc03M3GBamYQB3Qng1U5YSR9qczs';
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=uploaded_photos`;

        const res = await fetch(url);
        const text = await res.text();
        const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*?)\);/);

        if (!match) return;

        const json = JSON.parse(match[1]);
        if (!json.table || !json.table.rows) return;

        photos = [];
        const rows = json.table.rows;

        rows.forEach((row, idx) => {
            if (idx === 0) return; // Skip headers
            const cells = row.c;
            if (!cells || !cells[2]?.v) return;

            const tagged = (cells[4]?.v || '')
                .toString()
                .split(',')
                .map(n => n.trim())
                .filter(Boolean);

            photos.push({
                filename: cells[1]?.v || '',
                url: cells[2].v,
                fileId: cells[3]?.v || '',
                tagged
            });
        });

        displayPhotos();
    } catch (err) {
        console.log('Could not load uploaded images');
    }
}

// ===== UPLOAD + PER-PHOTO TAGGING =====

let selectedFilesData = []; // { file, previewUrl, tags: Set<string> }

function handleFileSelection() {
    const fileInput = document.getElementById('photo-upload');
    const files = Array.from(fileInput.files).filter(f => f.type.startsWith('image/'));

    selectedFilesData = files.map(file => ({
        file,
        previewUrl: URL.createObjectURL(file),
        tags: new Set()
    }));

    renderTagPreviewList();
}

function renderTagPreviewList() {
    const container = document.getElementById('tag-preview-list');

    if (selectedFilesData.length === 0) {
        container.innerHTML = '';
        return;
    }

    container.innerHTML = '';

    selectedFilesData.forEach((entry, fileIdx) => {
        const item = document.createElement('div');
        item.className = 'tag-preview-item';

        const img = document.createElement('img');
        img.src = entry.previewUrl;
        item.appendChild(img);

        const checksWrap = document.createElement('div');
        checksWrap.className = 'tag-preview-checks';

        const label = document.createElement('div');
        label.textContent = "who's in this one?";
        label.style.fontWeight = 'bold';
        label.style.marginBottom = '5px';
        checksWrap.appendChild(label);

        if (guestList.length === 0) {
            const none = document.createElement('div');
            none.className = 'tag-box-empty';
            none.textContent = 'no guest list loaded yet';
            checksWrap.appendChild(none);
        }

        guestList.forEach(guest => {
            const guestLabel = document.createElement('label');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.onchange = () => {
                if (checkbox.checked) {
                    entry.tags.add(guest.name);
                } else {
                    entry.tags.delete(guest.name);
                }
            };
            guestLabel.appendChild(checkbox);
            guestLabel.append(` ${guest.avatar} ${guest.name}`);
            checksWrap.appendChild(guestLabel);
        });

        item.appendChild(checksWrap);
        container.appendChild(item);
    });

    const confirmBtn = document.createElement('button');
    confirmBtn.id = 'confirm-upload-btn';
    confirmBtn.textContent = 'confirm & upload';
    confirmBtn.onclick = confirmUpload;
    container.appendChild(confirmBtn);
}

function readFileAsDataURL(file) {
    return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
    });
}

async function confirmUpload() {
    if (selectedFilesData.length === 0) return;

    for (const entry of selectedFilesData) {
        const base64 = await readFileAsDataURL(entry.file);
        await sendImageToGoogleDrive(entry.file.name, base64, Array.from(entry.tags));
    }

    playSound('yay');

    selectedFilesData.forEach(entry => URL.revokeObjectURL(entry.previewUrl));
    selectedFilesData = [];
    document.getElementById('tag-preview-list').innerHTML = '';
    document.getElementById('photo-upload').value = '';

    loadUploadedImages();
}

async function sendImageToGoogleDrive(filename, base64Data, tagged) {
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbxFnAHaBt0mCIz1W6RleNC83sz3Dj987D0R-1JndtVefjMx8LFBeqO2VOECngBD7ges/exec';

    try {
        await fetch(sheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: 'uploadPhoto',
                filename: filename,
                imageData: base64Data,
                tagged: tagged.join(',')
            })
        });
    } catch (err) {
        console.error('Upload error:', err);
    }
}

// ===== LIGHTBOX =====

function openLightbox(idx) {
    currentLightboxIndex = idx;
    const photo = photos[idx];

    document.getElementById('lightbox-image').src = photo.url;
    renderLightboxTagsView();

    document.getElementById('photo-lightbox').classList.add('active');
}

function closeLightbox() {
    document.getElementById('photo-lightbox').classList.remove('active');
    currentLightboxIndex = null;
}

function handleLightboxBackgroundClick(event) {
    if (event.target.id === 'photo-lightbox') {
        closeLightbox();
    }
}

function renderLightboxTagsView() {
    const photo = photos[currentLightboxIndex];
    const viewEl = document.getElementById('lightbox-tags-view');
    const editEl = document.getElementById('lightbox-tags-edit');

    viewEl.style.display = 'block';
    editEl.style.display = 'none';
    document.getElementById('lightbox-edit-btn').style.display = 'inline-block';
    document.getElementById('lightbox-save-btn').style.display = 'none';

    if (photo.tagged.length === 0) {
        viewEl.innerHTML = '<p class="tag-box-empty">no one tagged yet</p>';
        return;
    }

    viewEl.innerHTML = photo.tagged.map(name => {
        const guest = findGuest(name);
        const color = guest ? (colors.find(c => c.name === guest.color)?.hex || '#000') : '#000';
        const avatar = guest ? guest.avatar : '';
        return `<div class="tag-box" style="color: ${color}">${avatar} ${name}</div>`;
    }).join('');
}

function startEditTags() {
    const photo = photos[currentLightboxIndex];

    if (!photo.fileId) {
        alert("can't edit tags on this photo (missing id)");
        return;
    }

    const viewEl = document.getElementById('lightbox-tags-view');
    const editEl = document.getElementById('lightbox-tags-edit');

    viewEl.style.display = 'none';
    editEl.style.display = 'block';
    document.getElementById('lightbox-edit-btn').style.display = 'none';
    document.getElementById('lightbox-save-btn').style.display = 'inline-block';

    editEl.innerHTML = '';
    guestList.forEach(guest => {
        const label = document.createElement('label');
        label.className = 'tag-edit-row';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = guest.name;
        checkbox.checked = photo.tagged.includes(guest.name);
        label.appendChild(checkbox);
        label.append(` ${guest.avatar} ${guest.name}`);
        editEl.appendChild(label);
    });
}

async function saveEditTags() {
    const photo = photos[currentLightboxIndex];
    const editEl = document.getElementById('lightbox-tags-edit');
    const checked = Array.from(editEl.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);

    photo.tagged = checked;
    await updatePhotoTags(photo.fileId, checked);
    renderLightboxTagsView();
}

async function updatePhotoTags(fileId, tagged) {
    const sheetUrl = 'https://script.google.com/macros/s/AKfycbxFnAHaBt0mCIz1W6RleNC83sz3Dj987D0R-1JndtVefjMx8LFBeqO2VOECngBD7ges/exec';

    try {
        await fetch(sheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                action: 'updateTags',
                fileId: fileId,
                tagged: tagged.join(',')
            })
        });
    } catch (err) {
        console.error('Update tags error:', err);
    }
}

displayResponses();
loadUploadedImages();
updateAvatarPreview();
initializeColorSelector();
